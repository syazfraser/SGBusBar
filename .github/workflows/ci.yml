# Runs the tests and a Release build for every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show tool versions
        run: xcodebuild -version && swift --version

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SGBusBar.xcodeproj -scheme SGBusBar \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            -resultBundlePath build/TestResults.xcresult

      # The optimiser can behave differently from Debug, so check a Release build too.
      - name: Build Release (Apple silicon and Intel)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SGBusBar.xcodeproj -scheme SGBusBar -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build
          lipo -archs build/Build/Products/Release/SGBusBar.app/Contents/MacOS/SGBusBar

      - name: Keep the test results if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/TestResults.xcresult
