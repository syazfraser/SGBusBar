# Pushing a tag like v0.3.0 tests and builds the app, publishes it as a GitHub Release with the
# notes from CHANGELOG.md, and (if the HOMEBREW_TAP_TOKEN secret is set) updates the Homebrew cask.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Check the tag matches the app's version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(xcodebuild -project SGBusBar.xcodeproj -target SGBusBar -showBuildSettings | awk '/ MARKETING_VERSION / { print $3 }')
          if [ "$VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $APP_VERSION. Bump the version in Xcode first."
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test -project SGBusBar.xcodeproj -scheme SGBusBar -destination 'platform=macOS' -derivedDataPath build

      - name: Build Release (Apple silicon and Intel)
        run: |
          set -o pipefail
          xcodebuild build -project SGBusBar.xcodeproj -scheme SGBusBar -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build

      - name: Package
        run: |
          ZIP="SGBusBar-$VERSION.zip"
          ditto -c -k --keepParent build/Build/Products/Release/SGBusBar.app "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "SHA256=$(cut -d ' ' -f 1 "$ZIP.sha256")" >> "$GITHUB_ENV"

      - name: Write release notes from CHANGELOG.md
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && !/^\[.*\]: / { print }
          ' CHANGELOG.md > release-notes.md
          cat >> release-notes.md <<'NOTES'

          ### Install
          - Homebrew: `brew install --cask syazfraser/tap/sgbusbar` (or `brew upgrade --cask sgbusbar`)
          - Or download the zip below, unzip it and move SGBusBar to Applications.

          SGBusBar isn't notarised yet: the first time you open it, go to System Settings > Privacy & Security and click Open Anyway.
          NOTES

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "SGBusBar $VERSION" --notes-file release-notes.md

      - name: Update the Homebrew cask
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:$TAP_TOKEN@github.com/syazfraser/homebrew-tap.git" tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/sgbusbar.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sgbusbar $VERSION"
          git push
